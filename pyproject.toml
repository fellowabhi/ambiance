[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambiance"
version = "0.1.0"
description = "Ambient lighting engine: drive RGB devices (Logitech G515 over Bluetooth, ...) from context sources such as Spotify."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
    "dbus-fast>=2.20",
    "bleak>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ambiance = "ambiance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
